name: Deploy NavoPath

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce product changelog
        shell: bash
        run: |
          node scripts/changelog-maintain.mjs --check
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed="$(git diff --name-only HEAD^ HEAD)"
            if echo "$changed" | grep -Eq '^(src/|supabase/|mcp-worker/)' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "User-visible product changes require a current CHANGELOG.md update."
              exit 1
            fi
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run size:check

      - name: Check MCP Worker
        run: npm ci --prefix mcp-worker && npm run typecheck --prefix mcp-worker
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy Supabase backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ICS_ENCRYPTION_KEY: ${{ secrets.ICS_ENCRYPTION_KEY }}
        run: |
          npx supabase@2.115.0 link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase@2.115.0 db push --linked --yes
          npx supabase@2.115.0 secrets set "ICS_ENCRYPTION_KEY=$ICS_ENCRYPTION_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase@2.115.0 functions deploy ai-assistant --project-ref "$SUPABASE_PROJECT_REF" --use-api
          npx supabase@2.115.0 functions deploy external-calendar --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name navopath-xiaoyang --branch production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
