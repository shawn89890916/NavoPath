<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="NavoPath connects long-term planning with realistic daily execution." />
    <link rel="icon" href="/navopath-icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>NavoPath — Navigate your next step.</title>
    <link rel="preconnect" href="https://qplymrkgsnaaamxggwxw.supabase.co" crossorigin />
    <style>
      /* Minimal skeleton — visible instantly, replaced when React mounts */
      html, body { margin: 0; padding: 0; background: #151310; font-family: system-ui, sans-serif; }
      #root { min-height: 100vh; position: relative; }
      .boot-skeleton { min-height:100vh; background:#151310; }
      .boot-head { height:62px; border-bottom:1px solid #35312b; display:flex; align-items:center; padding:0 24px; gap:16px; }
      .boot-dot,.boot-line,.boot-card { display:block; background:#2a2722; }
      .boot-dot { width:28px; height:28px; border-radius:50%; }
      .boot-line { height:10px; width:96px; }
      .boot-body { display:grid; grid-template-columns:minmax(260px,32%) 1fr; min-height:calc(100vh - 63px); }
      .boot-list { padding:28px 24px; border-right:1px solid #35312b; }
      .boot-list .boot-card { height:54px; margin:14px 0; border-bottom:1px solid #35312b; }
      .boot-grid { margin:28px; background:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,#302c27 48px); }
      @media (max-width:899.98px) {
        html,body,#root,.boot-skeleton { width:100%; min-width:0; min-height:0; height:100%; overflow:hidden; }
        .boot-head { height:56px; padding:0 14px; }
        .boot-body { display:block; min-height:calc(100dvh - 56px); }
        .boot-list { display:none; }
        .boot-grid { height:calc(100dvh - 140px); margin:18px 12px 84px; }
      }
    </style>
    <script>
      // Pre-React error handler: if the JS bundle fails to load or throws
      // before React mounts, display the error instead of a blank white page.
      window.addEventListener("error", function (event) {
        var el = document.createElement("div");
        el.style.cssText = "position:fixed;inset:0;padding:24px;font-family:monospace;font-size:13px;white-space:pre-wrap;color:#C96F5B;background:#fff;z-index:99999;overflow:auto;";
        var msg = (event.error && event.error.stack) ? event.error.stack : (event.message || String(event.error || event));
        el.innerHTML = "<h2 style='color:#C96F5B;margin:0 0 12px'>Fatal Error (pre-React)</h2><pre>" + msg.replace(/</g,"&lt;") + "</pre><button onclick='location.reload()' style='margin-top:12px;padding:6px 12px;font-size:14px'>Reload</button>";
        document.body && document.body.appendChild(el);
      });
      window.addEventListener("unhandledrejection", function (event) {
        console.error("Unhandled promise rejection:", event.reason);
      });
      // A page left open during a deployment can still hold an older entry
      // bundle whose lazy chunk no longer exists. Vite emits this event before
      // rejecting the import; reload once to move the page to the new manifest.
      window.addEventListener("vite:preloadError", function (event) {
        var key = "navopath:asset-recovery";
        var lastReload = Number(sessionStorage.getItem(key) || 0);
        if (Date.now() - lastReload < 60000) return;
        event.preventDefault();
        sessionStorage.setItem(key, String(Date.now()));
        location.reload();
      });
      window.addEventListener("load", function () {
        window.setTimeout(function () { sessionStorage.removeItem("navopath:asset-recovery"); }, 10000);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-skeleton" aria-busy="true" aria-label="正在加载工作区">
        <div class="boot-head"><span class="boot-dot"></span><span class="boot-line"></span></div>
        <div class="boot-body"><section class="boot-list"><span class="boot-line"></span><i class="boot-card"></i><i class="boot-card"></i><i class="boot-card"></i><i class="boot-card"></i></section><section class="boot-grid"></section></div>
      </div>
    </div>
    <script type="module" src="/src/nativeRuntime.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
