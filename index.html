<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NavoPath connects long-term planning with realistic daily execution." />
    <link rel="icon" href="/navopath-icon.png" />
    <title>NavoPath — Navigate your next step.</title>
    <link rel="preconnect" href="https://zduevgdfdukvnhhyzxrh.supabase.co" crossorigin />
    <style>
      /* Minimal skeleton — visible instantly, replaced when React mounts */
      html, body { margin: 0; padding: 0; background: #0D1117; font-family: system-ui, sans-serif; }
      #root { min-height: 100vh; position: relative; }
      .df-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      .df-loading svg { width: 40px; height: 40px; opacity: 0.6; }
      .df-loading span { color: #8B949E; font-size: 13px; letter-spacing: 0.02em; }
      @keyframes np-pulse { 0%,100%{opacity:0.4} 50%{opacity:0.9} }
      .df-loading .pulse { animation: np-pulse 1.6s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="df-loading">
        <svg viewBox="0 0 32 32" fill="none" stroke="#C69CF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3v26M5 9h22M5 23h22"/>
          <circle cx="16" cy="5" r="2" fill="#C69CF9" stroke="none"/>
          <circle cx="5" cy="9" r="2" fill="#C69CF9" stroke="none"/>
          <circle cx="27" cy="9" r="2" fill="#C69CF9" stroke="none"/>
          <circle cx="5" cy="23" r="2" fill="#C69CF9" stroke="none"/>
          <circle cx="27" cy="23" r="2" fill="#C69CF9" stroke="none"/>
          <circle cx="16" cy="27" r="2" fill="#C69CF9" stroke="none"/>
        </svg>
        <span class="pulse">NavoPath</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
